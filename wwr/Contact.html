<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for questions, bookings, and support in Ghana and worldwide rafting adventures.">
    <meta name="author" content="Janet Agyapong">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <h1>Contact Us</h1>

        <!-- COMPANY INFORMATION -->
        <section class="company-info">

            <h2>Company Information</h2>

            <p><strong>Address:</strong> Volta River Area, Akosombo, Ghana</p>
            <p><strong>Phone:</strong> +233 24 000 0000</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <!-- GHANA RIVER MAP (VOLTA RIVER) -->
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.4047!2d0.0471!3d6.2540!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x102074a6b5b3c3c7%3A0x2a0e9a0c8f9d2c00!2sVolta%20River!5e0!3m2!1sen!2sgh!4v1710000000000"
              width="100%" height="300" style="border:0;" loading="lazy">
            </iframe>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">

            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Operations Manager">
                <figcaption>Sarah Johnson - Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Lead Guide">
                <figcaption>David Smith - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Customer Support">
                <figcaption>Ama Boateng - Customer Support</figcaption>
            </figure>

        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message</p>

                <label>
                    <input type="radio" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>© 2026 White Water Rafting | Janet Agyapong</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>

            <a href="https://instargram.com">
                <img src="images/instargram.png" alt="Instargram">
            </a>

        </nav>

    </footer>

</body>

</html>
