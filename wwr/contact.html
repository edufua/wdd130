<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting for questions, bookings, and support in Ghana and worldwide rafting adventures.">
    <meta name="author" content="Janet Agyapong">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>Company Information</h2>
            <p><strong>Address:</strong> Volta River Area, Akosombo, Ghana</p>
            <p><strong>Phone:</strong> +233 24 000 0000</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe
              src="https://maps.google.com/maps?q=Akosombo%20Dam&t=&z=13&ie=UTF8&iwloc=&output=embed"
              width="100%" height="300" style="border:0;" loading="lazy">
            </iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Johnson - Operations Manager">
                    <figcaption>Sarah Johnson - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="David Smith - Lead Guide">
                    <figcaption>David Smith - Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Ama Boateng - Customer Support">
                    <figcaption>Ama Boateng - Customer Support</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message</p>
                <div class="radio-group">

                    <label>
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter"> Subscribe me to the
                    monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 White Water Rafting | Janet Agyapong</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter ">
            </a>
            <a href="https://instargram.com">
                <img src="images/instargram.png" alt="Instargram">
            </a>
        </nav>
    </footer>

</body>

</html>
